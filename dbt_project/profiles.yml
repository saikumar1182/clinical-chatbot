clinical_chat:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'clinical_user') }}"
      password: "{{ env_var('DBT_PASSWORD', 'clinical_pass') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'clinical') }}"
      schema: silver
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10

    ci:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'clinical_user') }}"
      password: "{{ env_var('DBT_PASSWORD', 'clinical_pass') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'clinical_test') }}"
      schema: silver
      threads: 2
      keepalives_idle: 0

    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      schema: silver
      threads: 8
      keepalives_idle: 0
