name: 'clinical_chat'
version: '1.0.0'
config-version: 2

profile: 'clinical_chat'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  clinical_chat:
    bronze:
      +materialized: view
      +schema: raw
    silver:
      +materialized: incremental
      +schema: silver
      +on_schema_change: append_new_columns
    gold:
      +materialized: table
      +schema: gold

seeds:
  clinical_chat:
    +schema: gold
    +quote_columns: false

vars:
  'dbt_utils_dispatch_list': ['dbt_utils']
