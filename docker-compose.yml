x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-clinicaluser}:${POSTGRES_PASSWORD:-clinical}@postgres:5433/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    # App DB connection for code running inside Airflow containers
    DATABASE_URL: postgresql://${POSTGRES_USER:-clinicaluser}:${POSTGRES_PASSWORD:-clinical}@postgres:5433/${POSTGRES_DB:-clinicaldb}

    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION}
    BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
    WANDB_API_KEY: ${WANDB_API_KEY}
    WEAVE_PROJECT: ${WEAVE_PROJECT}

    DBT_HOST: postgres
    DBT_USER: ${POSTGRES_USER:-clinicaluser}
    DBT_PASSWORD: ${POSTGRES_PASSWORD:-clinical}
    DBT_DBNAME: ${POSTGRES_DB:-clinicaldb}
    DBT_PORT: "5433"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt
    - ./src:/opt/airflow/src
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins

  depends_on:
    postgres:
      condition: service_healthy

  networks:
    - clinical-net

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinical-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicaldb}
      POSTGRES_USER: ${POSTGRES_USER:-clinicaluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinical}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicaluser} -d ${POSTGRES_DB:-clinicaldb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - clinical-net

  airflow-init:
    <<: *airflow-common
    container_name: clinical-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install astronomer-cosmos==1.5.1 dbt-postgres==1.8.2 dbt-utils
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
        airflow connections add clinical_postgres \
          --conn-type postgres \
          --conn-host postgres \
          --conn-login ${POSTGRES_USER:-clinicaluser} \
          --conn-password ${POSTGRES_PASSWORD:-clinical} \
          --conn-schema ${POSTGRES_DB:-clinicaldb} \
          --conn-port 5433 || true
        airflow pools set bedrock_pool 3 "AWS Bedrock rate limiter" || true
        airflow pools set api_pool 5 "ClinicalTrials API rate limiter" || true
        airflow variables set clinical_conditions \
          '["diabetes","lung cancer","alzheimer","cardiovascular","obesity"]' || true
        echo "Airflow init complete ✅"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: clinical-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: clinical-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
  airflow_plugins:

networks:
  clinical-net:
    driver: bridge