x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__SECRETS__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    DBT_VENV: /opt/airflow/dbt_venv

    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_HOST: postgres

    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION:-eu-west-3}
    BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-eu.anthropic.claude-sonnet-4-5-20250929-v1:0}
    WANDB_API_KEY: ${WANDB_API_KEY}
    WEAVE_PROJECT: ${WEAVE_PROJECT}

    DBT_HOST: postgres
    DBT_USER: ${POSTGRES_USER}
    DBT_PASSWORD: ${POSTGRES_PASSWORD}
    DBT_DBNAME: ${POSTGRES_DB}
    DBT_PORT: "5432"
    DBT_SCHEMA: silver

    PYTHONPATH: /opt/airflow

  volumes:
    - ./dbt_project:/opt/airflow/dbt_project
    - ./src:/opt/airflow/src
    - ./eval_datasets:/opt/airflow/eval_datasets
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins

  depends_on:
    postgres:
      condition: service_healthy

  networks:
    - clinical-net

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinicalchat-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicaldb}
      POSTGRES_USER: ${POSTGRES_USER:-clinical_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinical_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinical_user} -d ${POSTGRES_DB:-clinicaldb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clinical-net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: clinicalchat-app
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-sonnet-20240229-v1:0}
      WANDB_API_KEY: ${WANDB_API_KEY}
      WEAVE_PROJECT: ${WEAVE_PROJECT}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./src:/app/src
    networks:
      - clinical-net
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: clinicalchat-airflow-init
    entrypoint: /bin/bash
    command:
      - -lc
      - |
          set -euo pipefail

          echo "=== Waiting for postgres to be ready ==="
          until pg_isready -h postgres -U "${POSTGRES_USER:-clinical_user}"; do
            echo "  postgres not ready yet, waiting 3s..."
            sleep 3
          done
          echo "  postgres is ready ✅"

          echo "=== Verifying cosmos + dbt are installed in image ==="
          python -c "import cosmos; print('cosmos OK')"
          "$$DBT_VENV/bin/dbt" --version >/dev/null
          echo "dbt OK"

          echo "=== Running Airflow DB migration ==="
          airflow db migrate

          echo "=== Registering Airflow Connections ==="
          airflow connections add clinical_postgres \
            --conn-type postgres \
            --conn-host postgres \
            --conn-login "${POSTGRES_USER}" \
            --conn-password "${POSTGRES_PASSWORD}" \
            --conn-schema "${POSTGRES_DB}" \
            --conn-port 5432 || true

          echo "=== Setting up Pools ==="
          airflow pools set bedrock_pool 3 "AWS Bedrock — max 3 concurrent calls" || true
          airflow pools set api_pool 5 "ClinicalTrials.gov — max 5 concurrent fetches" || true

          echo "=== Setting Airflow Variables ==="
          airflow variables set clinical_conditions '["cancer", "vision", "urology", "kidney disease", "HIV/AIDS", "endocrine", "digestive", "diabetes", "cardiovascular", "alzheimer", "alcohol abuse and alcoholism"]' || true
          airflow variables set embed_batch_size '50' || true

          echo "=== Airflow init complete ✅ ==="
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: clinicalchat-airflow-web
    command: ["airflow", "api-server"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: clinicalchat-airflow-scheduler
    command: ["airflow", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: clinicalchat-airflow-dag-processor
    command: ["airflow", "dag-processor"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
  airflow_plugins:

networks:
  clinical-net:
    driver: bridge
