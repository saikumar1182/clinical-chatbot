name: CI Pipeline & Quality Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  # Job 1: Lint + Unit Tests
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.POSTGRES_USER }} -d ${{ vars.POSTGRES_DB }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
        - name: Checkout code
          uses: actions/checkout@v5

        - name: Set up Python 3.11
          uses: actions/setup-python@v6
          with:
            python-version: "3.11"
            cache: "pip"
            cache-dependency-path: |
              requirements.txt
              requirements-dev.txt
        
        - name: Install dependencies
          run: pip install -r requirements.txt -r requirements-dev.txt
        
        - name: Linting
          run: ruff check src/ app/ tests/ dags/ --fix
        
        - name: Type checking
          run: mypy src/ --ignore-missing-imports
        
        - name: Init test database
          env:
            PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          run: |
            psql \
            -h localhost -U ${{ vars.POSTGRES_USER }} -d ${{ vars.POSTGRES_DB }} -f src/db/init.sql

        - name: Run Pytest/unit tests
          run: pytest tests/ -v --tb=short --cov=src --cov-report=xml --ignore=tests/test_dags.py
          env:
            AWS_REGION: eu-west-3
            DATABASE_URL: postgresql+psycopg2://${{ vars.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ vars.POSTGRES_DB }}

        - name: Upload coverage report
          uses: codecov/codecov-action@v6
          with:
            files: coverage.xml

  # Job 2: DBT Tests
  dbt-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dbt.txt
      
      - name: Install DBT dependencies
        run: pip install -r requirements-dbt.txt

      - name: Init test database
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql \
            -h localhost -U ${{ vars.POSTGRES_USER }} -d ${{ vars.POSTGRES_DB }} \
            -f src/db/init.sql

      - name: dbt deps + seed + run
        working-directory: dbt_project
        run: |
          dbt deps
          dbt seed --target ci
          dbt run --target ci
        env:
          DBT_HOST: localhost
          DBT_USER: ${{ vars.POSTGRES_USER }}
          DBT_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DBT_DBNAME: ${{ vars.POSTGRES_DB }}

      - name: "🚨 dbt test — Quality Gate (blocks merge on failure)"
        working-directory: dbt_project
        env:
          DBT_HOST: localhost
          DBT_USER: ${{ vars.POSTGRES_USER }}
          DBT_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DBT_DBNAME: ${{ vars.POSTGRES_DB }}
        run: dbt test --target ci

  # Job 3: DAG Validation
  dag-validation:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
        
      - name: Install dependencies AIRFLOW + DBT + Cosmos
        run: |
          pip install \
          pytest==8.2.2 \
          dbt-postgres==1.7.17 \
          astronomer-cosmos==1.13.1 \
          apache-airflow-providers-postgres==6.6.1 \
          apache-airflow-providers-amazon==9.23.0 \
          apache-airflow-providers-slack==9.8.0

      - name: Mirror Airflow dbt path for Cosmos
        run: |
          sudo mkdir -p /opt/airflow
          sudo ln -s "$GITHUB_WORKSPACE/dbt_project" /opt/airflow/dbt_project

      - name: Validate DAG Syntax (import tests)
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/ci_test_airflow.db
          AIRFLOW__CORE__FERNET_KEY: ${{ vars.AIRFLOW_FERNET_KEY }}
          AIRFLOW_VAR_CLINICAL_CONDITIONS: '["oncology"]'
          AIRFLOW_VAR_DBT_TARGET: "ci"
        run: |
          airflow db migrate
          python <<'PY'
          import os
          import sys
          sys.path.insert(0, ".")
          from airflow.models import DagBag

          dag_bag = DagBag(dag_folder="dags/", include_examples=False)
          assert not dag_bag.import_errors, f"DAG import errors: {dag_bag.import_errors}"
          print(f"✅ All {len(dag_bag.dags)} DAGs imported successfully: {list(dag_bag.dags.keys())}")
          PY
      - name: Run DAG unit tests
        run: pytest tests/test_dags.py -v --tb=short